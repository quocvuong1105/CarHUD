
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CarHUD - Firmware Flasher</title>

  <script
    type="module"
    src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module">
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101827;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .panel {
      width: min(92%, 430px);
      padding: 30px;
      background: #1c293b;
      border: 1px solid #34445b;
      border-radius: 16px;
      text-align: center;
    }

    h2 { margin: 0 0 8px; }

    .subtitle {
      color: #aab8ca;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .file-box {
      display: block;
      padding: 25px 15px;
      border: 2px dashed #526783;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .file-box:hover {
      border-color: #36a3ff;
      background: #24364d;
    }

    .file-box input { display: none; }

    .file-name {
      color: #aab8ca;
      font-size: 13px;
      overflow-wrap: anywhere;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 9px;
      background: #1685e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #526174;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      color: #aab8ca;
      font-size: 13px;
      line-height: 1.6;
    }

    .warning {
      margin-top: 22px;
      color: #f5c66b;
      font-size: 12px;
      line-height: 1.5;
    }

    esp-web-install-button:not([install-unsupported]) {
      display: block;
    }

    esp-web-install-button button {
      background: #16a36a;
    }
  </style>
</head>

<body>
  <main class="panel">
    <h2>CARHUD</h2>
    <div class="subtitle">ESP32-S3 Firmware Flasher</div>

    <label class="file-box">
      <strong>📁 CHỌN FIRMWARE (.BIN)</strong>
      <div class="file-name" id="fileName">
        Chưa chọn file firmware
      </div>
      <input type="file" id="firmware" accept=".bin,application/octet-stream">
    </label>

    <esp-web-install-button id="installer">
      <button slot="activate" id="flashButton" disabled>
        NẠP FIRMWARE
      </button>

      <span slot="unsupported">
        Trình duyệt không hỗ trợ Web Serial. Hãy dùng Chrome hoặc Edge trên máy tính.
      </span>

      <span slot="not-allowed">
        Hãy mở website bằng HTTPS.
      </span>
    </esp-web-install-button>

    <div class="status" id="status">
      Chọn file firmware để bắt đầu.
    </div>

    <div class="warning">
      Chỉ sử dụng firmware đúng cho bo LCDWiki ES3C28P.
      Không ngắt cáp USB trong quá trình nạp.
    </div>
  </main>

  <script type="module">
    const fileInput = document.getElementById("firmware");
    const fileName = document.getElementById("fileName");
    const flashButton = document.getElementById("flashButton");
    const installer = document.getElementById("installer");
    const status = document.getElementById("status");

    let firmwareURL = null;
    let manifestURL = null;

    function formatSize(bytes) {
      return (bytes / 1024 / 1024).toFixed(2) + " MB";
    }

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];

      if (!file) return;

      if (!file.name.toLowerCase().endsWith(".bin")) {
        status.textContent = "File không hợp lệ. Hãy chọn file .bin";
        flashButton.disabled = true;
        return;
      }

      if (firmwareURL) URL.revokeObjectURL(firmwareURL);
      if (manifestURL) URL.revokeObjectURL(manifestURL);

      firmwareURL = URL.createObjectURL(file);

      const manifest = {
        name: "CarHUD ES3C28P",
        version: "Local firmware",
        builds: [
          {
            chipFamily: "ESP32-S3",
            parts: [
              {
                path: firmwareURL,
                offset: 0
              }
            ]
          }
        ]
      };

      const manifestBlob = new Blob(
        [JSON.stringify(manifest)],
        { type: "application/json" }
      );

      manifestURL = URL.createObjectURL(manifestBlob);

      await customElements.whenDefined("esp-web-install-button");

      installer.manifest = manifestURL;

      fileName.textContent =
        file.name + " (" + formatSize(file.size) + ")";

      flashButton.disabled = false;

      status.textContent =
        "Đã chọn firmware. Nhấn NẠP FIRMWARE để kết nối bo mạch.";
    });
  </script>
</body>
</html>
