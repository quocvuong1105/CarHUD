name: Build CarHUD for ESP32-S3 (ES3C28P / ES3N28P)

on:
  push:
    branches: [main, feature/modular-i18n-crowdin, feature/rename-carhud-project]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ESP32-S3 firmware
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node.js for LVGL font generation
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"

      - name: Install LVGL font converter
        run: npm install --global lv_font_conv@1.5.3

      - name: Rebuild LVGL fonts with Vietnamese glyphs
        run: python3 Car-Dashboard-ES3C28P/tools/fonts/generate_fonts.py

      - name: Find Arduino sketch
        id: sketch
        shell: bash
        run: |
          mapfile -t FILES < <(
            find . -type f -name "*.ino" \
              ! -path "./.git/*"
          )

          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one .ino file."
            printf '%s\n' "${FILES[@]}"
            exit 1
          fi

          SKETCH_DIR=$(dirname "${FILES[0]}")
          SKETCH_NAME=$(basename "${FILES[0]}" .ino)

          if [ "$(basename "$SKETCH_DIR")" != "$SKETCH_NAME" ]; then
            echo "Sketch folder must match .ino file."
            echo "Folder: $SKETCH_DIR"
            echo "File: ${FILES[0]}"
            exit 1
          fi

          echo "dir=$SKETCH_DIR" >> "$GITHUB_OUTPUT"
          echo "Sketch: ${FILES[0]}"
          echo "Directory: $SKETCH_DIR"

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP32 board index
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install ESP32 Arduino core
        run: |
          arduino-cli core install esp32:esp32@3.2.1

      - name: Install Arduino libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "lvgl@9.6.0"
          arduino-cli lib install LovyanGFX

      - name: Validate and generate translation catalogs
        run: python3 Car-Dashboard-ES3C28P/tools/i18n/generate_translations.py

      - name: Compile firmware
        run: |
          mkdir -p firmware-output

          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            --warnings all \
            --output-dir "$GITHUB_WORKSPACE/firmware-output" \
            "${{ steps.sketch.outputs.dir }}"

      - name: List firmware files
        if: always()
        run: |
          find firmware-output -type f \
            -printf '%f %s bytes\n' || true

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: CarHUD-firmware
          path: firmware-output/*
          if-no-files-found: error
          retention-days: 30
