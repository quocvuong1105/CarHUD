name: Release Firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Firmware version (example: v1.0.0)"
        required: true
        type: string
        default: "v1.0.0"

      release_notes:
        description: "Release notes"
        required: true
        type: string
        default: "CarHUD ESP32-S3 firmware release"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    name: Build, publish firmware and deploy website
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Use format v1.0.0"
            exit 1
          fi

      - name: Check existing version tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --refs origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "ERROR: Tag ${VERSION} already exists."
            echo "Please use a new version."
            exit 1
          else
            RESULT=$?
            if [ "$RESULT" -ne 2 ]; then
              echo "ERROR: Could not check remote tags."
              exit 1
            fi
          fi

          echo "Version ${VERSION} is available."

      - name: Find Arduino sketch
        id: sketch
        shell: bash
        run: |
          mapfile -t FILES < <(
            find . -type f -name "*.ino" \
              ! -path "./.git/*"
          )

          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one .ino file."
            printf '%s\n' "${FILES[@]}"
            exit 1
          fi

          SKETCH_DIR=$(dirname "${FILES[0]}")

          echo "dir=$SKETCH_DIR" >> "$GITHUB_OUTPUT"
          echo "Sketch directory: $SKETCH_DIR"
          echo "Sketch file: ${FILES[0]}"

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP32 board index
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install ESP32 Arduino core
        run: |
          arduino-cli core install esp32:esp32@3.2.1

      - name: Install Arduino libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "lvgl@9.6.0"
          arduino-cli lib install LovyanGFX

      - name: Compile ESP32-S3 firmware
        run: |
          mkdir -p firmware-output

          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            --warnings all \
            --output-dir "$GITHUB_WORKSPACE/firmware-output" \
            "${{ steps.sketch.outputs.dir }}"

      - name: Prepare merged firmware
        run: |
          echo "Generated firmware files:"
          find firmware-output -type f \
            -printf '%f %s bytes\n'

          MERGED_FILE=$(find firmware-output \
            -type f -name "*.merged.bin" -print -quit)

          if [ -z "$MERGED_FILE" ]; then
            echo "ERROR: merged firmware not found!"
            exit 1
          fi

          mkdir -p firmware-release

          cp "$MERGED_FILE" \
            firmware-release/CarHUD-ES3C28P-merged.bin

          echo "Prepared firmware:"
          ls -lh firmware-release/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: CarHUD-${{ inputs.version }}
          path: firmware-release/CarHUD-ES3C28P-merged.bin
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: CarHUD ESP32-S3 ${{ inputs.version }}
          body: |
            ${{ inputs.release_notes }}

            ## Firmware
            - Board: LCDWiki ES3C28P
            - Chip: ESP32-S3
            - Flash: 16 MB
            - PSRAM: OPI

            Firmware file:
            - CarHUD-ES3C28P-merged.bin
          target_commitish: main
          files: firmware-release/CarHUD-ES3C28P-merged.bin
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      # ==========================================
      # AUTOMATIC GITHUB PAGES DEPLOYMENT
      # ==========================================

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Collect firmware from all Releases
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          mkdir -p webflasher/firmware

          # Remove old generated firmware files.
          find webflasher/firmware \
            -maxdepth 1 -type f -name "*.bin" -delete

          echo "Collecting firmware from all GitHub Releases..."

          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue

            echo "Checking release: $TAG"

            TMP_DIR=$(mktemp -d)

            if gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "CarHUD-ES3C28P-merged.bin" \
              --dir "$TMP_DIR"; then

              cp "$TMP_DIR/CarHUD-ES3C28P-merged.bin" \
                "webflasher/firmware/${TAG}.bin"

              echo "Added: ${TAG}.bin"
            else
              echo "No firmware asset found for $TAG"
            fi

            rm -rf "$TMP_DIR"

          done < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases" \
              --jq '.[].tag_name'
          )

          # Ensure the newly published firmware is present.
          if [ ! -f "webflasher/firmware/${CURRENT_VERSION}.bin" ]; then
            echo "ERROR: Current firmware was not collected."
            exit 1
          fi

          echo "Firmware files ready for deployment:"
          ls -lh webflasher/firmware/

      - name: Check website files
        run: |
          if [ ! -f webflasher/index.html ]; then
            echo "ERROR: webflasher/index.html not found."
            exit 1
          fi

          echo "Website is ready."

      - name: Upload website to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./webflasher

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
